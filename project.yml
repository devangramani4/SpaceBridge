# Optional: regenerate the Xcode project with XcodeGen (`brew install xcodegen && xcodegen generate`).
# The checked-in SpaceBridge.xcodeproj is equivalent and generated by scripts/generate_xcodeproj.py.
name: SpaceBridge
options:
  bundleIdPrefix: com.geniusbridge
  deploymentTarget:
    macOS: "14.0"
  organizationName: Genius Bridge Technologies
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
targets:
  SpaceBridge:
    type: application
    platform: macOS
    sources:
      - path: SpaceBridge
        excludes: ["Resources/Info.plist", "Resources/SpaceBridge.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geniusbridge.SpaceBridge
        INFOPLIST_FILE: SpaceBridge/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: SpaceBridge/Resources/SpaceBridge.entitlements
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SpaceBridgeTests:
    type: bundle.unit-test
    platform: macOS
    sources: [SpaceBridgeTests]
    dependencies:
      - target: SpaceBridge
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
